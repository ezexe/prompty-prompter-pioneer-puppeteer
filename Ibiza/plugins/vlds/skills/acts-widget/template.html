<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>__TITLE__</title>
<style>
/* Two panes: the acts to pick, and the prompt they assemble; one column on narrow panes */
:root {
  --bg: #f5f6f8; --surface: #ffffff; --fg: #1b2230; --muted: #5b6577;
  --line: #d9dde5; --accent: #2747b8; --accent-soft: #e6ebfa; --code-bg: #eef1f6; --ok: #1f7a4d;
  --font-body: "Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #12161e; --surface: #1a1f2a; --fg: #e5e9f0; --muted: #9aa4b5;
  --line: #2c3442; --accent: #8ea6ff; --accent-soft: #232c45; --code-bg: #10141b; --ok: #5fcf96; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #12161e; --surface: #1a1f2a; --fg: #e5e9f0; --muted: #9aa4b5;
  --line: #2c3442; --accent: #8ea6ff; --accent-soft: #232c45; --code-bg: #10141b; --ok: #5fcf96; color-scheme: dark }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 15px; line-height: 1.5; padding-inline: 16px; padding-block: 20px 32px; }
.wrap { max-width: 1120px; margin: 0 auto; display: grid; gap: 18px; }
h1 { font-size: 1.35rem; margin: 0; text-wrap: balance; }
.lede { margin: 4px 0 0; color: var(--muted); max-width: 65ch; }
.panes { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.1fr); gap: 18px; align-items: start; }
@media (max-width: 760px) { .panes { grid-template-columns: minmax(0, 1fr); } }
.label { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); font-weight: 700; margin: 0 0 8px; }
.acts { display: grid; gap: 10px; }
.act { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; display: grid; gap: 8px; }
.act.on { border-color: var(--accent); background: var(--accent-soft); }
.act-head { display: flex; gap: 10px; align-items: flex-start; cursor: pointer; }
.act-head input { margin-top: 4px; width: 18px; height: 18px; accent-color: var(--accent); flex: none; }
.act-title { font-weight: 700; }
.act-sum { color: var(--muted); font-size: 0.9rem; }
.chip { font-size: 0.7rem; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: var(--accent); border: 1px solid var(--accent); border-radius: 999px; padding: 1px 8px; margin-left: 6px; vertical-align: 2px; }
textarea { width: 100%; min-height: 52px; resize: vertical; font: inherit; font-size: 0.9rem; color: var(--fg); background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; }
.row { display: flex; gap: 8px; flex-wrap: wrap; }
button { font: inherit; font-weight: 700; border-radius: 6px; padding: 8px 14px; cursor: pointer; border: 1px solid var(--accent); }
button.primary { background: var(--accent); color: var(--bg); }
button.ghost { background: transparent; color: var(--accent); }
button:focus-visible, input:focus-visible, textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.out { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 14px; display: grid; gap: 10px; min-width: 0; position: sticky; top: 0; }
pre { margin: 0; background: var(--code-bg); border-radius: 6px; padding: 12px; overflow: auto; font-family: var(--font-mono); font-size: 0.8rem; line-height: 1.55; white-space: pre-wrap; word-break: break-word; max-height: 70vh; }
.status { font-size: 0.85rem; color: var(--ok); min-height: 1.2em; }
.empty { color: var(--muted); font-style: italic; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1 id="title"></h1>
    <p class="lede">Tick the acts you want and add context if you like. The prompt on the right is what you send: it names each picked act in order, lists what you left out, and says how the reply must report.</p>
  </header>
  <div class="panes">
    <section aria-labelledby="acts-label">
      <p class="label" id="acts-label">Pending acts</p>
      <div class="row" style="margin-bottom:10px">
        <button class="ghost" id="all" type="button">Select all</button>
        <button class="ghost" id="none" type="button">Clear</button>
      </div>
      <div class="acts" id="acts"></div>
    </section>
    <section class="out" aria-labelledby="out-label">
      <p class="label" id="out-label">Prompt to send</p>
      <pre id="prompt"></pre>
      <div class="row"><button class="primary" id="copy" type="button">Copy prompt</button></div>
      <div class="status" id="status" role="status"></div>
    </section>
  </div>
</div>
<script>
/*__ASSEMBLE__*/
const DATA = /*__DATA__*/null;
const picked = new Set(DATA.acts.filter((a) => a.recommended).map((a) => a.id));
const notes = {};
const $ = (id) => document.getElementById(id);
$("title").textContent = DATA.title || "Pending acts";

function render() {
  $("acts").innerHTML = "";
  for (const a of DATA.acts) {
    const on = picked.has(a.id);
    const card = document.createElement("div");
    card.className = "act" + (on ? " on" : "");
    card.innerHTML =
      '<label class="act-head"><input type="checkbox"><span><span class="act-title"></span>' +
      (a.recommended ? '<span class="chip">Recommended</span>' : "") +
      '<br><span class="act-sum"></span></span></label>' +
      '<textarea placeholder="Add context for this act (optional)"></textarea>';
    const cb = card.querySelector("input");
    cb.id = "cb-" + a.id; cb.checked = on;
    card.querySelector("label").htmlFor = cb.id;
    card.querySelector(".act-title").textContent = a.title;
    card.querySelector(".act-sum").textContent = a.summary || "";
    const ta = card.querySelector("textarea");
    ta.id = "note-" + a.id; ta.hidden = !on; ta.value = notes[a.id] || "";
    ta.addEventListener("input", () => { notes[a.id] = ta.value; show(); });
    cb.addEventListener("change", () => { cb.checked ? picked.add(a.id) : picked.delete(a.id); render(); });
    $("acts").appendChild(card);
  }
  show();
}
function current() { return assemblePrompt(DATA, DATA.acts.map((a) => a.id).filter((id) => picked.has(id)), notes); }
function show() {
  const md = current();
  if (md) $("prompt").textContent = md;
  else $("prompt").innerHTML = '<span class="empty">Tick at least one act to build the prompt.</span>';
}
$("all").addEventListener("click", () => { DATA.acts.forEach((a) => picked.add(a.id)); render(); });
$("none").addEventListener("click", () => { picked.clear(); render(); });
$("copy").addEventListener("click", () => {
  const md = current();
  if (!md) { $("status").textContent = "Nothing to copy yet: tick an act first."; return; }
  const fallback = () => {
    const r = document.createRange(); r.selectNodeContents($("prompt"));
    const s = getSelection(); s.removeAllRanges(); s.addRange(r);
    $("status").textContent = "Copying is blocked here, so the prompt is selected: press Ctrl+C or ⌘C.";
  };
  try { navigator.clipboard.writeText(md).then(() => { $("status").textContent = "Copied. Paste it as your next message."; }, fallback); }
  catch (e) { fallback(); }
});
render();
</script>
</body>
</html>
